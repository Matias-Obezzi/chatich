<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Gradients -->
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9146FF" /> <!-- Twitch -->
            <stop offset="33%" stop-color="#22D3EE" /> <!-- Neon Cyan -->
            <stop offset="66%" stop-color="#53FC18" /> <!-- Kick -->
            <stop offset="100%" stop-color="#FF0033" /> <!-- YouTube -->
        </linearGradient>

        <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#12121D" />
            <stop offset="100%" stop-color="#0B0B14" />
        </linearGradient>

        <!-- Glow Effect -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Base Squircle -->
    <rect x="32" y="32" width="448" height="448" rx="120" fill="url(#innerGrad)" stroke="url(#borderGrad)" stroke-width="20" filter="url(#glow)" />

    <!-- Chat Bubble / Broadcast Icon -->
    <g transform="translate(130, 140)">
        <!-- Outer Chat Bubble Outline -->
        <path d="M40 90 C40 40, 75 15, 126 15 C177 15, 212 40, 212 90 C212 140, 177 165, 126 165 C105 165, 87 159, 72 150 L32 174 L44 135 C36 123, 40 106, 40 90 Z" fill="none" stroke="#22D3EE" stroke-width="20" stroke-linejoin="round" filter="url(#neon-glow)" />
        
        <!-- Animated / Sound Bars -->
        <rect x="91" y="65" width="16" height="50" rx="8" fill="#9146FF" />
        <rect x="119" y="45" width="16" height="70" rx="8" fill="#53FC18" />
        <rect x="147" y="75" width="16" height="40" rx="8" fill="#FF0033" />
    </g>
</svg>